[custom0]
binding='<Super>t'
command='wezterm'
name='Launch terminal'

[custom1]
binding='<Super>s'
command='budgie-control-center'
name='Launch settings'

[custom2]
binding='<Primary><Super>KP_Add'
command='bctl up'
name='Ext brightness up'

[custom3]
binding='<Primary><Super>KP_Subtract'
command='bctl down'
name='Ext brightness down'

[custom4]
binding='<Super>w'
command="sh -c 'gtk-launch \"$(xdg-settings get default-web-browser)\"'"
name='Launch web browser'
